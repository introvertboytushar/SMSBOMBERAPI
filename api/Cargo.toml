[package]
name = "send_bombing"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"] # Cloudflare Workers-er jonno eta dorkar

[dependencies]
worker = "0.0.18" # Vercel runtime-er poriborte eta use korun
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
